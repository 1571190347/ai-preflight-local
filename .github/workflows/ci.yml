name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      # The HTTP integration test serves real files from dist/.
      - name: Build interface
        run: pnpm build
      - name: Test application
        run: pnpm test
      - name: Test optional services
        run: pnpm test:services
      - name: Test DNS collector with loopback HTTP, UDP, and TCP
        if: runner.os != 'Windows'
        env:
          DNS_COLLECTOR_INTEGRATION: '1'
        run: node --test services/dns-collector/test/*.test.mjs
      - name: Build release archives
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: node scripts/package-release.mjs
      - name: Upload release build artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-preflight-local-release-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
